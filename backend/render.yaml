services:
  - type: web
    name: oil-india-sif-backend
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_BACKEND
        value: groq
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false  # Set manually in Render dashboard for security
      - key: PYTHON_VERSION
        value: "3.11.6"
